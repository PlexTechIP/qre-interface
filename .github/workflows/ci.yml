name: CI

on:
  pull_request:
  push:

jobs:
  # Ubuntu-only: repo is private, so Actions minutes are metered, and
  # macOS/Windows cost far more per minute. Revisit once repo is public.
  #
  # All jobs run only on PRs or pushes to main, so pushing to an open
  # PR branch triggers each job once instead of twice.
  node-checks:
    name: typecheck + fast unit tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer and shared contracts
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck Electron main and shared contracts
        run: npx tsc --noEmit -p tsconfig.node.json

      # Build BEFORE the tests, not after: the only tests that exercise the
      # shipped MCP bundle skip when dist-electron is absent, so in this order
      # they were never once run in CI.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  lint:
    name: lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  dependency-audit:
    name: dependency audit
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (fails on new high/critical advisories)
        run: npm audit --audit-level=high

  real-engine-checks:
    name: real QDK engine tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm ci

      - name: Install qdk[qre]
        run: src/main/engine/python/setup_venv.sh

      - name: Real engine tests
        run: npm run test:engine
