name: CI

on:
  pull_request:
    branches: [week-2/team-3, main]
  push:
    branches: [week-2/team-3, main]

jobs:
  node-checks:
    name: typecheck + fast unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer and shared contracts
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck Electron main and shared contracts
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Unit tests
        run: npm run test

  real-engine-checks:
    name: real QDK engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm ci

      - name: Install qdk[qre]
        run: src/main/engine/python/setup_venv.sh

      - name: Real engine tests
        run: npm run test:engine
